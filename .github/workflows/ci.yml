name: EFA Club CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Seed CI fixtures
        run: python -c "from tests.ci_fixtures import seed_ci_fixtures; seed_ci_fixtures()"

      - name: Run site test agent (regression suite)
        run: python tests/site_test_agent.py
        env:
          GITHUB_ACTIONS: "true"

      - name: Run pytest unit tests
        run: pytest tests/ -v --ignore=tests/test_ui_playwright.py

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Seed CI fixtures
        run: python -c "from tests.ci_fixtures import seed_ci_fixtures; seed_ci_fixtures()"

      - name: Run Streamlit UI smoke tests (AppTest)
        run: pytest tests/test_ui_playwright.py -v
        env:
          GITHUB_ACTIONS: "true"
          EFA_TEST_USER: "Antonio Calderon"
          EFA_TEST_PASSWORD: "EFAIC2026001CA"